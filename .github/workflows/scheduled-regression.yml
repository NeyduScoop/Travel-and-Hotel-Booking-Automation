name: Scheduled Regression

# Default: 02:00 UTC (03:00 Africa/Lagos), Monday-Friday.
# To change the cadence, edit the cron expression below.
on:
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-regression
  cancel-in-progress: false

jobs:
  regression:
    name: Nightly regression (chromium) + cross-browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CI: 'true'
      TEST_ENV: ${{ vars.TEST_ENV || 'DEVTEST' }}
      PRIME_EMAIL: ${{ secrets.PRIME_EMAIL }}
      PRIME_PASSWORD: ${{ secrets.PRIME_PASSWORD }}
      AFFILIATE_EMAIL: ${{ secrets.AFFILIATE_EMAIL }}
      AFFILIATE_PASSWORD: ${{ secrets.AFFILIATE_PASSWORD }}
      # Scheduled runs never create bookings or authenticate payments.
      ALLOW_TEST_BOOKING_SUBMISSION: 'false'
      ALLOW_TEST_PAYMENT_AUTHENTICATION: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: TypeScript validation
        run: npm run typecheck

      - name: Run regression suite (chromium)
        id: regression
        continue-on-error: true
        run: npm run test:regression

      - name: Keep regression results
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts/regression
          cp -r playwright-report artifacts/regression/ 2>/dev/null || true
          cp -r test-results artifacts/regression/ 2>/dev/null || true

      - name: Run cross-browser smoke (firefox, webkit)
        id: crossbrowser
        continue-on-error: true
        run: npx playwright test --project=firefox --project=webkit --grep @smoke

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-regression-${{ github.run_id }}
          path: |
            artifacts/regression/
            playwright-report/
            test-results/
          retention-days: 30

      - name: Fail the run if any suite failed
        if: ${{ steps.regression.outcome == 'failure' || steps.crossbrowser.outcome == 'failure' }}
        run: |
          echo "::error::Regression outcome: ${{ steps.regression.outcome }}; cross-browser smoke outcome: ${{ steps.crossbrowser.outcome }}"
          exit 1
