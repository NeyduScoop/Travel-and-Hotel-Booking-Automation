name: Smoke Tests

# Runs on every push (no schedule) and on demand.
on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Wakanow environment
        type: choice
        options: [DEVTEST, PREPROD]
        default: DEVTEST

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      TEST_ENV: ${{ inputs.environment || vars.TEST_ENV || 'DEVTEST' }}
      PRIME_EMAIL: ${{ secrets.PRIME_EMAIL }}
      PRIME_PASSWORD: ${{ secrets.PRIME_PASSWORD }}
      AFFILIATE_EMAIL: ${{ secrets.AFFILIATE_EMAIL }}
      AFFILIATE_PASSWORD: ${{ secrets.AFFILIATE_PASSWORD }}
      # Smoke never creates bookings or authenticates payments.
      ALLOW_TEST_BOOKING_SUBMISSION: 'false'
      ALLOW_TEST_PAYMENT_AUTHENTICATION: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: TypeScript validation
        run: npm run typecheck

      - name: Run smoke suite
        run: npm run test:smoke

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: smoke-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload failure evidence and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: smoke-test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 14
